<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loup géant – carte du quartier</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fbfaf6;--fg:#1c2b24;--mut:#5f6f67;--line:#e2ded1;--zone:#1f7a54;--accent:#e8590c;--danger:#c92a2a;--shadow:0 6px 22px rgba(20,40,30,.22);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17211c;--fg:#eef4ef;--mut:#9db0a5;--line:#2f4037;--zone:#4cc38a;--accent:#ff922b;--danger:#ff8787;--shadow:0 6px 22px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#map{position:fixed;inset:0;background:#dfe5dc}
.leaflet-control-attribution{font-size:10px}
.leaflet-bar{border:none!important;box-shadow:var(--shadow)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important;background:var(--bg)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important}
#adminBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:1000;border:none;background:var(--fg);color:var(--bg);border-radius:999px;padding:11px 18px;font:700 14px inherit;cursor:pointer;box-shadow:var(--shadow)}
#adminBtn:focus-visible,.b:focus-visible,.fab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:900;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;border:none;background:var(--bg);color:var(--fg);font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
#status{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:900;background:var(--bg);border-radius:999px;padding:9px 15px;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;max-width:calc(100% - 90px)}
#status i{width:9px;height:9px;border-radius:50%;background:#2563eb;flex:none}
#panel{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:1001;background:var(--bg);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:none;max-height:62%;overflow:auto;max-width:520px;margin:0 auto}
#panel h2{margin:0 0 6px;font-size:18px}
.row{display:grid;grid-template-columns:100px 1fr 64px;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.row output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--zone);width:100%}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0;line-height:1.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.b{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:11px 14px;font:700 14px inherit;cursor:pointer}
.b.main{background:var(--zone);border-color:var(--zone);color:#fff;margin-left:auto}
.b.warn{color:var(--danger)}
.b.on{border-color:var(--accent);background:rgba(232,89,12,.12)}
#link{width:100%;margin-top:8px;padding:9px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font-size:12px}
.handle{background:var(--accent);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:20px;border:3px solid #fff;box-shadow:var(--shadow)}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 0 rgba(37,99,235,.55);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
@media (prefers-reduced-motion:reduce){.me{animation:none}}
@media (max-width:480px){.row{grid-template-columns:82px 1fr 58px}}
</style>
</head>
<body>
<div id="map"></div>
<button id="adminBtn" type="button">Admin</button>
<div id="status"><i></i><span id="stxt">Recherche de ta position…</span></div>
<div id="fabs">
  <button class="fab" id="fitBtn" type="button" aria-label="Voir toute la zone" title="Voir toute la zone">⤢</button>
  <button class="fab" id="locBtn" type="button" aria-label="Me retrouver" title="Me retrouver">◎</button>
</div>

<section id="panel" aria-label="Réglages administrateur">
  <h2>Réglages de la zone</h2>
  <div class="row"><label for="w">Largeur</label><input id="w" type="range" min="100" max="3000" step="50"><output id="wo"></output></div>
  <div class="row"><label for="h">Hauteur</label><input id="h" type="range" min="100" max="3000" step="50"><output id="ho"></output></div>
  <div class="row"><label for="r">Rayon du cercle</label><input id="r" type="range" min="20" max="500" step="10"><output id="ro"></output></div>
  <p class="hint" id="hint">Déplace la zone avec la poignée orange. Pour la cachette, appuie sur « Placer le cercle » puis touche la carte.</p>
  <div class="btns">
    <button class="b" id="place" type="button">Placer le cercle</button>
    <button class="b warn" id="clear" type="button">Retirer le cercle</button>
    <button class="b main" id="ok" type="button">Valider</button>
  </div>
  <div id="share" hidden>
    <p class="hint" id="hint2"></p>
    <input id="link" readonly>
    <div class="btns"><button class="b" id="copy" type="button">Copier le lien</button></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Code pour ouvrir le mode administrateur : à changer avant de publier
const PIN = "1234";
// Adresse de ta base Firebase, sans / à la fin. Laisse vide pour le mode « lien » seul.
const DB = "https://chasse-a-l-homme-22573-default-rtdb.europe-west1.firebasedatabase.app";
// Marge autour de la zone visible par les joueurs (0.3 = 30 % de chaque côté)
const MARGIN = 0.3;

const $ = id => document.getElementById(id);
let cfg = null, fromLink = false, admin = false, placing = false, handle = null;

try {
  const m = location.hash.match(/z=([^&]+)/);
  if (m) { cfg = JSON.parse(atob(decodeURIComponent(m[1]))); fromLink = true; }
} catch (e) { cfg = null; }
if (!cfg) cfg = { c: [47.1667, -1.4667], w: 800, h: 800, ci: null, r: 80 };

const map = L.map("map", { zoomSnap: 0.25, zoomDelta: 0.5, zoomControl: false, maxZoom: 19 }).setView(cfg.c, 15);
L.control.zoom({ position: "topleft" }).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  subdomains: "abcd", maxZoom: 19, attribution: "© OpenStreetMap, © CARTO"
}).addTo(map);

const world = [[-85, -180], [-85, 180], [85, 180], [85, -180]];
const mask = L.polygon([world, world], { stroke: false, fillColor: "#7d838c", fillOpacity: .78, interactive: false }).addTo(map);
const casing = L.rectangle([[0, 0], [1, 1]], { color: "#fff", weight: 9, opacity: .95, fill: false, interactive: false }).addTo(map);
const rect = L.rectangle([[0, 0], [1, 1]], { color: "#1f7a54", weight: 4, fill: false, interactive: false }).addTo(map);
const circ = L.circle([0, 0], { radius: 1, color: "#e03131", weight: 3, dashArray: "10 7", fillColor: "#e03131", fillOpacity: .2, interactive: false });

function zoneBounds() {
  const dLat = cfg.h / 2 / 111320;
  const dLng = cfg.w / 2 / (111320 * Math.cos(cfg.c[0] * Math.PI / 180));
  return L.latLngBounds([cfg.c[0] - dLat, cfg.c[1] - dLng], [cfg.c[0] + dLat, cfg.c[1] + dLng]);
}

function draw() {
  const b = zoneBounds();
  rect.setBounds(b); casing.setBounds(b);
  mask.setLatLngs([world, [b.getSouthWest(), b.getNorthWest(), b.getNorthEast(), b.getSouthEast()]]);
  if (cfg.ci) { circ.setLatLng(cfg.ci).setRadius(cfg.r || 80); if (!map.hasLayer(circ)) circ.addTo(map); }
  else if (map.hasLayer(circ)) map.removeLayer(circ);
  $("wo").textContent = cfg.w + " m";
  $("ho").textContent = cfg.h + " m";
  $("ro").textContent = (cfg.r || 80) + " m";
}

// Joueurs : toute la zone visible avec une marge, zoom libre, impossible de sortir de la marge
function lockPlayer() {
  const area = zoneBounds().pad(MARGIN);
  map.setMaxBounds(null);
  map.setMinZoom(0);
  map.fitBounds(area, { animate: false });
  map.setMinZoom(map.getZoom());
  map.options.maxBoundsViscosity = 1;
  map.setMaxBounds(area);
}
function unlockAdmin() { map.setMaxBounds(null); map.setMinZoom(3); }
function fitZone() { map.fitBounds(zoneBounds().pad(MARGIN), { animate: true }); }

// Position personnelle (visible uniquement par la personne elle-même)
const me = L.marker([0, 0], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, keyboard: false });
const acc = L.circle([0, 0], { radius: 1, stroke: false, fillColor: "#2563eb", fillOpacity: .13, interactive: false });
let firstFix = true;
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    me.setLatLng(ll); acc.setLatLng(ll).setRadius(p.coords.accuracy);
    if (!map.hasLayer(me)) { acc.addTo(map); me.addTo(map); }
    $("stxt").textContent = "Ta position · précision ~" + Math.round(p.coords.accuracy) + " m";
    if (firstFix && !fromLink) { cfg.c = ll; draw(); map.setView(ll, 16); }
    firstFix = false;
  }, () => { $("stxt").textContent = "Position indisponible : autorise la localisation."; },
  { enableHighAccuracy: true, maximumAge: 2000 });
} else {
  $("stxt").textContent = "La géolocalisation n’est pas disponible.";
}

$("fitBtn").onclick = () => admin ? map.fitBounds(zoneBounds().pad(0.3)) : fitZone();
$("locBtn").onclick = () => { if (map.hasLayer(me)) map.setView(me.getLatLng(), Math.max(map.getZoom(), 17)); };

function enterAdmin() {
  admin = true;
  $("share").hidden = true;
  $("panel").style.display = "block";
  $("fabs").style.display = "none";
  $("status").style.display = "none";
  $("adminBtn").textContent = "Admin ✓";
  $("w").value = cfg.w; $("h").value = cfg.h; $("r").value = cfg.r || 80;
  unlockAdmin();
  map.fitBounds(zoneBounds().pad(0.3), { animate: false });
  handle = L.marker(cfg.c, {
    draggable: true,
    icon: L.divIcon({ className: "", html: '<div class="handle">✥</div>', iconSize: [38, 38], iconAnchor: [19, 19] })
  }).addTo(map);
  handle.on("drag", e => { const p = e.target.getLatLng(); cfg.c = [p.lat, p.lng]; draw(); });
  draw();
}

function exitAdmin() {
  admin = false; placing = false;
  $("place").classList.remove("on");
  if (handle) { map.removeLayer(handle); handle = null; }
  $("fabs").style.display = "flex";
  $("status").style.display = "flex";
  $("adminBtn").textContent = "Admin";
}

$("adminBtn").onclick = () => {
  if (admin) return;
  const code = prompt("Code administrateur");
  if (code === null) return;
  if (code !== PIN) { alert("Code incorrect."); return; }
  enterAdmin();
};

$("w").oninput = e => { cfg.w = +e.target.value; draw(); };
$("h").oninput = e => { cfg.h = +e.target.value; draw(); };
$("r").oninput = e => { cfg.r = +e.target.value; draw(); };

$("place").onclick = () => {
  placing = true;
  $("place").classList.add("on");
  $("hint").textContent = "Touche la carte à l’endroit approximatif de la cachette.";
};
$("clear").onclick = () => { cfg.ci = null; draw(); };

map.on("click", e => {
  if (!admin || !placing) return;
  cfg.ci = [e.latlng.lat, e.latlng.lng];
  placing = false;
  $("place").classList.remove("on");
  $("hint").textContent = "Cercle placé. Ajuste son rayon ou valide.";
  draw();
});

$("ok").onclick = () => {
  exitAdmin();
  lockPlayer();
  const link = location.href.split("#")[0] + "#z=" + encodeURIComponent(btoa(JSON.stringify(cfg)));
  history.replaceState(null, "", link);
  $("link").value = link;
  $("share").hidden = false;
  if (DB) {
    $("hint2").textContent = "Envoi aux joueurs…";
    fetch(DB.replace(/\/$/, "") + "/state.json", { method: "PUT", body: JSON.stringify(Object.assign({}, cfg, { t: Date.now() })) })
      .then(r => { $("hint2").textContent = r.ok ? "Envoyé : les joueurs se mettent à jour tout seuls. Lien de secours :" : "Échec de l’envoi : vérifie les règles Firebase. Lien de secours :"; })
      .catch(() => { $("hint2").textContent = "Pas de connexion. Lien de secours :"; });
  } else {
    $("hint2").textContent = "Envoie ce lien aux joueurs :";
  }
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("link").value); $("copy").textContent = "Lien copié"; }
  catch (e) { $("link").select(); }
  setTimeout(() => { $("panel").style.display = "none"; $("copy").textContent = "Copier le lien"; }, 900);
};

// Mise à jour automatique : les joueurs relisent la zone et le cercle toutes les 5 s
let lastKey = "", firstPull = true;
async function pull() {
  if (!DB || admin) return;
  try {
    const r = await fetch(DB.replace(/\/$/, "") + "/state.json", { cache: "no-store" });
    const s = await r.json();
    if (!s || !s.c) return;
    const key = JSON.stringify(s);
    if (key === lastKey) return;
    const geo = JSON.stringify([s.c, s.w, s.h]) !== JSON.stringify([cfg.c, cfg.w, cfg.h]);
    lastKey = key; cfg = s; fromLink = true;
    draw();
    if (geo || firstPull) lockPlayer();
    firstPull = false;
  } catch (e) {}
}

draw();
if (fromLink) lockPlayer();
if (DB) {
  pull();
  setInterval(pull, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
}
</script>
</body>
</html>
